<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The halo on a black disc, so it holds on light browser chrome as well as on black.
       Strokes are heavier than the wordmark's ring so the lit limb survives at 16px. -->
  <defs>
    <linearGradient id="limb" x1="0.08" y1="0.12" x2="0.78" y2="0.82">
      <stop offset="0" stop-color="#f2f8ff"/>
      <stop offset="0.5" stop-color="#bcd9ff"/>
      <stop offset="0.82" stop-color="#bcd9ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="#000"/>
  <circle cx="16" cy="16" r="9.75" fill="none" stroke="#e9eff6" stroke-opacity="0.34" stroke-width="2.25"/>
  <circle cx="16" cy="16" r="9.75" fill="none" stroke="url(#limb)" stroke-width="3.5"/>
</svg>
