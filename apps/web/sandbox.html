<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Orya Halo engine sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #globe {
        position: fixed;
        inset: 0;
      }
      #stats {
        position: fixed;
        left: 12px;
        top: 12px;
        margin: 0;
        color: #9aa8ba;
        font:
          12px/16px ui-monospace,
          "Cascadia Mono",
          Consolas,
          monospace;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 0 4px #000;
      }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <pre id="stats"></pre>
    <script type="module" src="/src/dev/sandbox.ts"></script>
  </body>
</html>
